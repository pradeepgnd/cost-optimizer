# Dark theme with a lime accent: near-black surfaces, Manrope type, large radii.
[theme]
base = "dark"
primaryColor = "#8cff2e"
backgroundColor = "#050505"
secondaryBackgroundColor = "#171717"
textColor = "#f5f5f2"
linkColor = "#8cff2e"
font = "Manrope:https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
headingFont = "Manrope:https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
headingFontWeights = [800, 700, 700, 600, 600, 600]
baseRadius = "14px"
buttonRadius = "full"
borderColor = "#262626"
dataframeBorderColor = "#262626"
dataframeHeaderBackgroundColor = "#0d0d0d"
showWidgetBorder = true
greenColor = "#8cff2e"
blueColor = "#0099ff"
chartCategoricalColors = ["#8cff2e", "#0099ff", "#c8c8c0", "#ffb020", "#ff5c8a", "#7a5cff"]

[theme.sidebar]
backgroundColor = "#0d0d0d"
secondaryBackgroundColor = "#171717"
borderColor = "#1f1f1f"

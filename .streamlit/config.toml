# Cool ledger light: paper/ink atmosphere, teal accent, Sora + Source Sans 3.
# Tokens match docs/design.md. Figures (USD, tokens) use IBM Plex Mono via CSS in streamlit_app.py.
[theme]
base = "light"
primaryColor = "#0F6B5C"
backgroundColor = "#EEF1F5"
secondaryBackgroundColor = "#F8FAFC"
textColor = "#12151A"
linkColor = "#0F6B5C"
font = "Source Sans 3:https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap"
headingFont = "Sora:https://fonts.googleapis.com/css2?family=Sora:wght@600;700&display=swap"
headingFontWeights = [700, 700, 600, 600, 600, 600]
baseRadius = "10px"
buttonRadius = "10px"
borderColor = "#C9D1DB"
dataframeBorderColor = "#C9D1DB"
dataframeHeaderBackgroundColor = "#F8FAFC"
showWidgetBorder = true
greenColor = "#0F6B5C"
blueColor = "#1F4E79"
redColor = "#9B1C1C"
orangeColor = "#8A5A00"
chartCategoricalColors = ["#0F6B5C", "#1F4E79", "#6B5B3E", "#5A6570", "#0F6B5C", "#1F4E79"]

[theme.sidebar]
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#EEF1F5"
borderColor = "#C9D1DB"

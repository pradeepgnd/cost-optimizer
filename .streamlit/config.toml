# Dark native widgets for the fluid reference design.
[theme]
base = "dark"
primaryColor = "#FDE047"
backgroundColor = "#0A0A0A"
secondaryBackgroundColor = "#171717"
textColor = "#F6F6F6"
linkColor = "#FDE047"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&display=swap"
headingFontWeights = [900, 800, 750, 700, 700, 700]
baseRadius = "1rem"
buttonRadius = "full"
borderColor = "#343434"
dataframeBorderColor = "#343434"
dataframeHeaderBackgroundColor = "#202020"
showWidgetBorder = true
greenColor = "#34d399"
blueColor = "#a78bfa"
redColor = "#fb7185"
orangeColor = "#fde047"
chartCategoricalColors = ["#fde047", "#a78bfa", "#34d399", "#fb7185"]

[theme.sidebar]
backgroundColor = "#171717"
secondaryBackgroundColor = "#0A0A0A"
borderColor = "#343434"

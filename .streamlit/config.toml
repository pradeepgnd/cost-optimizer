# Hyper-Saturated Fluid: Cyber Yellow on Deep Onyx, Inter, pill controls.
# Source: .superdesign/design-system.md and drafts/cost-advisor-hyper-saturated-fluid.html.
[theme]
base = "dark"
primaryColor = "#FDE047"
backgroundColor = "#0A0A0A"
secondaryBackgroundColor = "#171717"
textColor = "#FFFFFF"
linkColor = "#FDE047"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&display=swap"
headingFontWeights = [900, 800, 700, 600, 600, 600]
baseRadius = "2rem"
buttonRadius = "full"
borderColor = "#262626"
dataframeBorderColor = "#262626"
dataframeHeaderBackgroundColor = "#171717"
showWidgetBorder = true
greenColor = "#FDE047"
blueColor = "#A3A3A3"
redColor = "#FFFFFF"
orangeColor = "#FDE047"
chartCategoricalColors = ["#FDE047", "#FFFFFF", "#A3A3A3", "#525252", "#E5E5E5", "#737373"]

[theme.sidebar]
backgroundColor = "#171717"
secondaryBackgroundColor = "#0A0A0A"
borderColor = "#262626"

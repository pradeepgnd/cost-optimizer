<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480" role="img" aria-label="Calculator with a dollar sign on its screen" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- ground shadow -->
  <ellipse cx="200" cy="448" rx="120" ry="18" fill="#0A0A0A" opacity="0.15"/>

  <g transform="translate(70 40) rotate(6 130 190)">
    <!-- offset shadow -->
    <rect x="12" y="14" width="260" height="370" rx="36" fill="#0A0A0A" opacity="0.18"/>

    <!-- body -->
    <rect x="0" y="0" width="260" height="370" rx="36" fill="#FF6B5A" stroke="#0A0A0A" stroke-width="8"/>

    <!-- display -->
    <rect x="26" y="28" width="208" height="96" rx="18" fill="#0A0A0A"/>
    <g fill="none" stroke="#3DDC97" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" transform="translate(130 76) scale(1.15)">
      <line x1="0" y1="-34" x2="0" y2="34"/>
      <path d="M20 -13 C20 -28 -20 -28 -20 -10 C-20 7 20 3 20 18 C20 33 -20 33 -20 15"/>
    </g>

    <!-- buttons -->
    <g stroke="#0A0A0A" stroke-width="5">
      <rect x="26" y="150" width="46" height="50" rx="13" fill="#0A0A0A"/>
      <rect x="82" y="150" width="46" height="50" rx="13" fill="#0A0A0A"/>
      <rect x="138" y="150" width="46" height="50" rx="13" fill="#0A0A0A"/>
      <rect x="194" y="150" width="40" height="50" rx="13" fill="#FFFFFF"/>

      <rect x="26" y="212" width="46" height="50" rx="13" fill="#FFFFFF"/>
      <rect x="82" y="212" width="46" height="50" rx="13" fill="#FFFFFF"/>
      <rect x="138" y="212" width="46" height="50" rx="13" fill="#FFFFFF"/>

      <rect x="26" y="274" width="46" height="50" rx="13" fill="#FFFFFF"/>
      <rect x="82" y="274" width="46" height="50" rx="13" fill="#FFFFFF"/>
      <rect x="138" y="274" width="46" height="50" rx="13" fill="#FFFFFF"/>

      <rect x="194" y="212" width="40" height="112" rx="13" fill="#FFDE4D"/>
    </g>
  </g>

  <!-- sparkles -->
  <g fill="#0A0A0A">
    <path transform="translate(350 70) scale(1)" d="M0 -20 Q0 0 20 0 Q0 0 0 20 Q0 0 -20 0 Q0 0 0 -20 Z"/>
    <path transform="translate(40 120) scale(0.7)" d="M0 -20 Q0 0 20 0 Q0 0 0 20 Q0 0 -20 0 Q0 0 0 -20 Z"/>
  </g>
</svg>
